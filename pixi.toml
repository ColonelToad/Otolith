[workspace]
authors = ["Christopher Onyiuke <chrisonyiuke@gmail.com>"]
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
name = "otolith"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# v0.6 mechanical phase. CAD + FEA is an opt-in environment because cadquery
# pulls in OpenCASCADE and is ~1.5 GB -- too heavy to impose on the default
# ROS/sim env just because the thigh might be rebuilt. Needs NO docker: the
# ASIC flow (iic-osic-tools / LibreLane / SKY130) is the only thing in this
# project that uses a container.
cad-install = "pixi install --environment cad"

[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-foxglove-bridge = ">=3.3.0,<4"
ros-jazzy-rmw-zenoh-cpp = ">=0.2.9,<0.3"
mujoco = ">=3.2"
numpy = ">=2.5.2,<3"
matplotlib = ">=3.11.1,<4"
pyyaml = ">=6.0.3,<7"
pytest = "<9"
cocotb = ">=2.0.1,<3"
catch2 = ">=3.16.0,<4"
colcon-common-extensions = ">=0.3.0,<0.4"
lttng-ust = ">=2.13.9,<3"
rust = ">=1.89"

[pypi-dependencies]
trimesh = ">=5.1.0, <6"

# v0.6 CAD + FEA. Opt-in via a pixi environment so the ~1.5 GB OpenCASCADE
# dependency does not land in the default ROS/sim environment:
#   pixi run -e cad python mech/links/thigh.py
[environments]
cad = { features = ["cad-deps"], no-default-feature = true }

[feature.cad-deps]
platforms = ["linux-64"]

[feature.cad-deps.dependencies]
# pytest lives here too, because the CAD gates are real gates and should run in
# the same invocation as everything else rather than as a separate command
# nobody remembers. `pixi run -e cad python -m pytest mech/tests -q`.
pytest = "<9"
cadquery = ">=2.8,<3"
# gmsh writes the CalculiX .inp directly (Abaqus dialect); CalculiX itself
# consumes only E and nu, both from mech/materials.py. python-gmsh is a SEPARATE
# conda package from gmsh -- without it you get libgmsh.so and no bindings.
gmsh = ">=4.13"
python-gmsh = ">=4.13"
calculix = ">=2.23"
